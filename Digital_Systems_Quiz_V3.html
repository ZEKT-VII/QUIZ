<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Logic Mastery | Advanced Quiz Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #121212;
            --surface-hover: #1a1a1a;
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --accent: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .mode-card {
            padding: 40px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mode-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .btn {
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .hidden { display: none !important; }

        .progress-container {
            height: 10px;
            background: var(--surface);
            border-radius: 5px;
            margin-bottom: 40px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.6s;
        }

        .question-card { padding: 40px; margin-bottom: 32px; }

        .scenario {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--primary);
            padding: 24px;
            border-radius: 4px 16px 16px 4px;
            margin-bottom: 24px;
            color: #d1d5db;
        }

        .option {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border);
            padding: 20px 24px;
            border-radius: 18px;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .option:hover:not(.disabled) { border-color: var(--primary); transform: translateX(8px); }
        .option.selected { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
        .option.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        .option.incorrect { border-color: var(--error); background: rgba(239, 68, 68, 0.1); }

        .explanation {
            margin-top: 32px;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        
        .reading-section { margin-bottom: 80px; }
        .reading-header { font-size: 2rem; font-weight: 800; margin-bottom: 32px; position: sticky; top: 0; background: var(--bg); padding: 20px 0; border-bottom: 1px solid var(--border); z-index: 10; }
        .reading-card { margin-bottom: 40px; padding: 32px; }

        .badge { padding: 4px 12px; border-radius: 100px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-blue { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="gradient-text">LogicMaster Pro</h1>
            <p>233 Expert Scenarios • Comprehensive Digital Logic Learning</p>
        </header>

        <div id="mainMenu">
            <div class="mode-grid">
                <div class="glass mode-card" onclick="app.startQuiz('full')">
                    <div style="font-size: 2rem;">🚀</div>
                    <h3>Full Simulation</h3>
                    <p>Randomized 233-question session covering all topics.</p>
                    <button class="btn btn-primary" style="margin-top:auto;">Start Quiz</button>
                </div>
                <div class="glass mode-card" onclick="app.showTopicSelector()">
                    <div style="font-size: 2rem;">🎯</div>
                    <h3>Targeted Study</h3>
                    <p>Focus on specific domains.</p>
                    <button class="btn btn-secondary" style="margin-top:auto;">Select Topics</button>
                </div>
                <div class="glass mode-card" onclick="app.startReadingMode()">
                    <div style="font-size: 2rem;">📖</div>
                    <h3>Reading Mode</h3>
                    <p>View all questions and explanations.</p>
                    <button class="btn btn-secondary" style="margin-top:auto;">Open Library</button>
                </div>
            </div>
        </div>

        <div id="topicSelector" class="hidden">
            <div class="glass" style="padding:40px;">
                <h2 style="margin-bottom:24px;">Select Domains</h2>
                <div id="topicList" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:12px; margin-bottom:32px;"></div>
                <button class="btn btn-secondary" onclick="app.showMainMenu()">Back</button>
                <button id="startTopicBtn" class="btn btn-primary" onclick="app.startQuiz('topic')" disabled>Start Quiz</button>
            </div>
        </div>

        <div id="quizScreen" class="hidden">
            <div style="display:flex; justify-content:space-between; margin-bottom:24px;">
                <div class="badge badge-blue">Question <span id="currentNum">1</span> / <span id="totalNum">233</span></div>
                <div class="badge badge-blue">Score: <span id="scoreNum">0</span></div>
            </div>
            <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
            <div id="questionArea"></div>
            <div style="margin-top:32px; display:flex; justify-content:space-between;">
                <button class="btn btn-secondary" onclick="app.prevQuestion()">Previous</button>
                <div style="display:flex; gap:12px;">
                    <button id="submitBtn" class="btn btn-primary" onclick="app.submitAnswer()">Submit</button>
                    <button id="nextBtn" class="btn btn-primary hidden" onclick="app.nextQuestion()">Next</button>
                    <button class="btn btn-secondary" onclick="app.finishQuiz()">Finish</button>
                </div>
            </div>
        </div>

        <div id="readingMode" class="hidden">
            <button class="btn btn-secondary" onclick="app.showMainMenu()" style="margin-bottom:32px;">Exit Library</button>
            <div id="readingContent"></div>
        </div>

        <div id="resultsScreen" class="hidden">
            <div class="glass" style="text-align:center; padding:60px;">
                <h2 id="scoreText" style="font-size:3rem; margin-bottom:24px;">0%</h2>
                <button class="btn btn-primary" onclick="app.restartQuiz()">Restart</button>
                <button class="btn btn-secondary" onclick="app.showMainMenu()">Home</button>
            </div>
        </div>
    </div>

    <script>
        const QUESTIONS = [
  {

        const app = {
            questions: QUESTIONS,
            currentSet: [],
            currentIndex: 0,
            answers: {},
            score: 0,
            submitted: false,
            selectedTopics: new Set(),

            init() {
                const topicCounts = {};
                this.questions.forEach(q => topicCounts[q.topic] = (topicCounts[q.topic] || 0) + 1);
                document.getElementById('topicList').innerHTML = Object.entries(topicCounts).map(([t, c]) => 
                    `<div class="option" onclick="app.toggleTopic(this, '${t}')">
                        <span>${t}</span>
                        <span class="badge badge-blue">${c}</span>
                    </div>`
                ).join('');
            },

            showMainMenu() { this.hideAll(); document.getElementById('mainMenu').classList.remove('hidden'); },
            showTopicSelector() { this.hideAll(); document.getElementById('topicSelector').classList.remove('hidden'); },

            toggleTopic(el, topic) {
                if (this.selectedTopics.has(topic)) { this.selectedTopics.delete(topic); el.classList.remove('selected'); }
                else { this.selectedTopics.add(topic); el.classList.add('selected'); }
                document.getElementById('startTopicBtn').disabled = this.selectedTopics.size === 0;
            },

            startQuiz(mode) {
                this.currentSet = mode === 'full' ? [...this.questions] : this.questions.filter(q => this.selectedTopics.has(q.topic));
                this.shuffle(this.currentSet);
                this.currentIndex = 0; this.answers = {}; this.score = 0;
                this.hideAll(); document.getElementById('quizScreen').classList.remove('hidden');
                this.renderQuestion();
            },

            renderQuestion() {
                const q = this.currentSet[this.currentIndex];
                const labels = ['A', 'B', 'C', 'D', 'E'];
                this.submitted = this.answers[this.currentIndex] !== undefined;
                
                document.getElementById('questionArea').innerHTML = `
                    <div class="glass question-card">
                        ${q.scenario ? `<div class="scenario">${q.scenario}</div>` : ''}
                        <div style="font-size:1.3rem; font-weight:700; margin-bottom:24px;">${q.question}</div>
                        ${q.options.map((opt, i) => `
                            <div class="option ${this.answers[this.currentIndex] === i ? 'selected' : ''} ${this.submitted ? 'disabled' : ''}" onclick="app.selectOption(${i})">
                                <b>${labels[i]}</b> ${opt.text}
                            </div>
                        `).join('')}
                        <div id="expl"></div>
                    </div>
                `;
                if (this.submitted) this.reveal(this.answers[this.currentIndex]);
                this.updateUI();
            },

            selectOption(i) { if (!this.submitted) { this.answers[this.currentIndex] = i; this.renderQuestion(); } },

            submitAnswer() {
                const i = this.answers[this.currentIndex];
                if (i === undefined) return;
                this.submitted = true;
                if (this.currentSet[this.currentIndex].options[i].correct) this.score++;
                this.renderQuestion();
            },

            reveal(i) {
                const q = this.currentSet[this.currentIndex];
                const correct = q.options[i].correct;
                document.getElementById('expl').innerHTML = `
                    <div class="explanation ${correct ? 'correct' : 'incorrect'}">
                        <b>${correct ? 'Correct!' : 'Incorrect'}</b>
                        <p>${q.options.find(o => o.correct).explanation}</p>
                    </div>`;
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
            },

            nextQuestion() { this.currentIndex++; if (this.currentIndex < this.currentSet.length) this.renderQuestion(); else this.finishQuiz(); },
            prevQuestion() { if (this.currentIndex > 0) { this.currentIndex--; this.renderQuestion(); } },

            updateUI() {
                document.getElementById('currentNum').textContent = this.currentIndex + 1;
                document.getElementById('totalNum').textContent = this.currentSet.length;
                document.getElementById('scoreNum').textContent = this.score;
                document.getElementById('progressBar').style.width = ((this.currentIndex + 1) / this.currentSet.length * 100) + '%';
            },

            finishQuiz() { this.hideAll(); document.getElementById('resultsScreen').classList.remove('hidden'); document.getElementById('scoreText').textContent = Math.round(this.score / this.currentSet.length * 100) + '%'; },

            startReadingMode() {
                this.hideAll(); document.getElementById('readingMode').classList.remove('hidden');
                const topics = [...new Set(this.questions.map(q => q.topic))].sort();
                document.getElementById('readingContent').innerHTML = topics.map(t => `
                    <div class="reading-section">
                        <div class="reading-header">${t}</div>
                        ${this.questions.filter(q => q.topic === t).map(q => `
                            <div class="glass reading-card">
                                <div style="font-weight:700; margin-bottom:16px;">${q.question}</div>
                                ${q.options.map(o => `<div style="color:${o.correct ? 'var(--success)' : 'var(--text-muted)'}; margin-bottom:8px;">• ${o.text}</div>`).join('')}
                                <div style="margin-top:16px; padding:16px; background:rgba(255,255,255,0.02); border-radius:8px; font-size:0.9rem;">
                                    ${q.options.find(o => o.correct).explanation}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            },

            restartQuiz() { this.startQuiz('full'); },
            hideAll() { ['mainMenu', 'topicSelector', 'quizScreen', 'readingMode', 'resultsScreen'].forEach(id => document.getElementById(id).classList.add('hidden')); },
            shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
        };
        app.init();
    </script>
